[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biletix-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for biletix.com events (trending, search, detail, venues)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
biletix-mcp = "biletix_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biletix_mcp"]
